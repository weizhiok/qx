name: Sync upstream repositories

on:
  workflow_dispatch:
  schedule:
    # Trigger daily at 18:17 UTC (03:17 JST), then run only on alternating UTC days.
    # This avoids the month-boundary problem of cron expressions like */2.
    - cron: '17 18 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce 48-hour cadence
        id: cadence
        shell: bash
        run: |
          set -euo pipefail

          # Manual runs should always sync immediately.
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Use Unix UTC day parity so the cadence remains 48 hours across
          # month and year boundaries.
          utc_day=$(( $(date -u +%s) / 86400 ))
          if (( utc_day % 2 == 0 )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping today; next scheduled sync window is in 24 hours."
          fi

      - name: Checkout target repository
        if: steps.cadence.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync afengye/QX
        if: steps.cadence.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sync_afengye
          git clone --depth=1 https://github.com/afengye/QX.git /tmp/sync_afengye
          mkdir -p sync_afengye
          # Add new files and overwrite changed files, but never delete files
          # from our repository just because they disappeared upstream.
          rsync -a --exclude='.git/' /tmp/sync_afengye/ sync_afengye/

      - name: Sync WeiGiegie/666
        if: steps.cadence.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sync_weigiegie
          git clone --depth=1 https://github.com/WeiGiegie/666.git /tmp/sync_weigiegie
          mkdir -p sync_weigiegie
          # Add new files and overwrite changed files, but never delete files
          # from our repository just because they disappeared upstream.
          rsync -a --exclude='.git/' /tmp/sync_weigiegie/ sync_weigiegie/

      - name: Commit synced content
        if: steps.cadence.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A sync_afengye sync_weigiegie
          if git diff --cached --quiet; then
            echo "No upstream changes to commit."
            exit 0
          fi
          git commit -m "sync: update upstream repositories"
          git push
