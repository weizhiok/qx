name: Sync afengye QX

on:
  workflow_dispatch:
  schedule:
    # 05:40 Asia/Taipei = 21:40 UTC on the previous calendar day.
    # Trigger daily, then the cadence gate below allows only every other Taipei day.
    - cron: '40 21 * * *'

permissions:
  contents: write

jobs:
  sync-afengye:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce 48-hour Taipei cadence
        id: cadence
        shell: bash
        run: |
          set -euo pipefail

          # Manual runs always sync immediately.
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Convert the current UTC epoch into a Taiwan-local day number (UTC+8).
          # The chosen parity is anchored so 2026-08-08 Taipei time is a sync day.
          taipei_day=$(( ($(date -u +%s) + 28800) / 86400 ))
          if (( taipei_day % 2 == 1 )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping today; next scheduled Taipei sync window is in 24 hours."
          fi

      - name: Checkout target repository
        if: steps.cadence.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone afengye/QX
        if: steps.cadence.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sync_afengye
          git clone --depth=1 https://github.com/afengye/QX.git /tmp/sync_afengye

      - name: Copy new and changed files only
        if: steps.cadence.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sync_afengye
          # Never use --delete and never clear the destination directory.
          # Existing files that disappear upstream remain preserved here.
          rsync -a --exclude='.git/' /tmp/sync_afengye/ sync_afengye/

      - name: Commit afengye changes
        if: steps.cadence.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A sync_afengye
          if git diff --cached --quiet; then
            echo "No afengye upstream changes to commit."
            exit 0
          fi
          git commit -m "sync: update afengye/QX"
          git pull --rebase origin main
          git push origin main
